<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Your marketing report</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <link rel="preconnect" href="https://dkecnwmzlvwbhnnfompn.supabase.co" crossorigin />
  <!-- Same import map as the app: the public report renders the SAME Preact
       components (report-body.js / report-view.js) as the in-app tab, so a
       client link is visually identical to what the agency sent. -->
  <script type="importmap">
    {
      "imports": {
        "preact": "https://esm.sh/preact@10.23.2",
        "preact/hooks": "https://esm.sh/preact@10.23.2/hooks",
        "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact"
      }
    }
  </script>
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="app" class="max-w-6xl mx-auto p-4 sm:p-6">
    <div class="text-center text-slate-400 text-sm py-24">Loading your report…</div>
  </div>
  <script type="module" src="/js/report-public.js"></script>
</body>
</html>
