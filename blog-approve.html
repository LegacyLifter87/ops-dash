<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Review your new article</title>
  <link rel="stylesheet" href="/tailwind.css" />
  <style>
    /* Article typography — mirrors a typical WordPress theme so the client
       reviews the post looking like it will on their site. */
    .wp-title { font-size: 2rem; line-height: 1.2; font-weight: 800; color: #0f172a; margin: 0 0 .25rem; overflow-wrap: break-word; }
    .wp-body { font-size: 1.0625rem; line-height: 1.75; color: #334155; overflow-wrap: break-word; }
    .wp-body h2 { font-size: 1.5rem; line-height: 1.3; font-weight: 700; color: #0f172a; margin: 2.25rem 0 .75rem; }
    .wp-body h3 { font-size: 1.2rem; line-height: 1.35; font-weight: 700; color: #1e293b; margin: 1.75rem 0 .5rem; }
    .wp-body p { margin: 0 0 1.1rem; }
    .wp-body ul, .wp-body ol { margin: 0 0 1.1rem; padding-left: 1.5rem; }
    .wp-body ul { list-style: disc; }
    .wp-body ol { list-style: decimal; }
    .wp-body li { margin: .35rem 0; }
    .wp-body li::marker { color: #94a3b8; }
    .wp-body a { color: #0d9488; text-decoration: underline; }
    .wp-body strong { color: #0f172a; }
    .wp-body blockquote { border-left: 4px solid #cbd5e1; background: #f8fafc; padding: .75rem 1.25rem; margin: 0 0 1.1rem; border-radius: 0 .5rem .5rem 0; font-style: italic; }
    .wp-body blockquote p:last-child { margin-bottom: 0; }
    .wp-body figure.wp-block-table { margin: 0 0 1.25rem; overflow-x: auto; }
    .wp-body table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    .wp-body th, .wp-body td { border: 1px solid #e2e8f0; padding: .55rem .8rem; text-align: left; vertical-align: top; }
    .wp-body th { background: #f1f5f9; font-weight: 600; color: #0f172a; }
    /* Locked photo-slot cards — real photos are added automatically at publish */
    .wp-body figure.ph { display: flex; align-items: center; gap: .9rem; margin: 0 0 1.25rem; padding: 1rem 1.1rem; border: 2px dashed #cbd5e1; border-radius: .75rem; background: #f8fafc; user-select: none; }
    .wp-body .ph-i { font-size: 1.75rem; }
    .wp-body .ph-t b { display: block; font-size: .85rem; color: #475569; font-weight: 600; }
    .wp-body .ph-t span { display: block; font-size: .8rem; color: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="app" class="max-w-3xl mx-auto p-4 sm:p-6" style="padding-bottom:9rem">
    <div class="text-center text-slate-400 text-sm py-24">Loading your article…</div>
  </div>
  <script type="module" src="/js/blog-approve.js"></script>
</body>
</html>
